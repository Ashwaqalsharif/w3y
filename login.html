<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | وَعْي W3Y</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<main class="hero-card">
    <h1>تسجيل الدخول</h1>

    <p>مرحبًا بك في منصة وَعْي</p>

  <form id="loginForm">
  
        <label for="username">اسم المستخدم</label>
        <br>
        <input type="text" id="username" name="username" required>

        <br><br>

        <label for="password">كلمة المرور</label>
        <br>
        <input type="password" id="password" name="password" required>

        <br><br>

        <button type="submit">تسجيل الدخول</button>
    </form>

    <p>ليس لديك حساب؟</p>
    <a href="register.html">
    <button type="button">إنشاء حساب</button>
</a>

    <br><br>

    <a href="index.html">العودة إلى الصفحة الرئيسية</a>
    </main>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value; 
     try {
    const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });

    const result = await response.json();

    if (response.ok) {
        window.location.href = "training.html";
    } else {
        alert(result.error || "اسم المستخدم أو كلمة المرور غير صحيحة");
    }
} catch (error) {
    alert("تعذّر الاتصال بالسيرفر");
}  
    });
</script>
</body>
